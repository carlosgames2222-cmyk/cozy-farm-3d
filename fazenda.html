<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cozy Farm 3D - Edition</title>
    <meta name="theme-color" content="#236b35">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/farm-icon.svg" type="image/svg+xml">
    <style>
        :root {
            --field-ink: #1d3322;
            --field-forest: #236b35;
            --field-leaf: #4b9b38;
            --field-paper: #f5f0d9;
            --field-paper-edge: #d6bc7f;
            --field-shadow: rgba(24,43,25,.32);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #70b8d6 0%, #a7c979 100%);
            color: var(--field-ink);
            user-select: none;
        }
        #gameCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        .ui-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
        .top-bar { display: flex; justify-content: center; gap: 10px; padding: 14px; pointer-events: all; }
        .resource-box {
            background: rgba(30, 48, 32, 0.88);
            border: 2px solid rgba(244, 239, 220, 0.4);
            color: #fff; padding: 8px 14px; border-radius: 14px;
            display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1rem;
            box-shadow: 0 6px 16px var(--field-shadow); backdrop-filter: blur(4px);
        }
        .resource-icon { font-size: 1.2em; }
        
        .action-bar {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; pointer-events: all; align-items: center;
            background: rgba(245, 240, 217, 0.92); border: 2px solid var(--field-paper-edge);
            padding: 8px 12px; border-radius: 20px; box-shadow: 0 8px 20px var(--field-shadow);
        }
        .action-btn {
            background: var(--field-forest); color: white; border: none;
            padding: 10px 16px; border-radius: 12px; font-size: 0.95rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease;
        }
        .action-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .action-btn.till { background: #8b5a2b; }
        .action-btn.plant { background: #278b43; }
        .action-btn.water { background: #2563eb; }
        .action-btn.harvest { background: #d97706; }
        .action-btn.active { outline: 3px solid #ffde59; }

        .crop-selector-popup {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96); border: 2px solid var(--field-paper-edge);
            padding: 10px; border-radius: 16px; display: none; gap: 8px; pointer-events: all;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }
        .crop-selector-popup.active { display: flex; }
        .crop-chip {
            padding: 8px 12px; border-radius: 10px; border: 1px solid #ddd;
            background: #fffdf5; cursor: pointer; font-weight: bold; font-size: 0.88rem;
            display: flex; align-items: center; gap: 6px;
        }
        .crop-chip.active { border-color: var(--field-leaf); background: #eef5d8; }

        .notification {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            background: var(--field-forest); color: white; padding: 10px 18px; border-radius: 12px;
            box-shadow: 0 6px 16px var(--field-shadow); font-weight: bold; font-size: 0.9rem;
            z-index: 200; animation: popup 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popup { from { transform: translate(-50%, -20px) scale(0.8); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="ui-overlay">
        <div class="top-bar">
            <div class="resource-box"><span class="resource-icon">💰</span><span id="coins">100</span></div>
            <div class="resource-box"><span class="resource-icon">💎</span><span id="gems">5</span></div>
            <div class="resource-box"><span class="resource-icon">⚡</span><span id="energy">100</span></div>
        </div>

        <div class="crop-selector-popup" id="cropPopup">
            <div class="crop-chip active" onclick="selectCrop('carrot')">🥕 Cenoura</div>
            <div class="crop-chip" onclick="selectCrop('wheat')">🌾 Trigo</div>
            <div class="crop-chip" onclick="selectCrop('tomato')">🍅 Tomate</div>
            <div class="crop-chip" onclick="selectCrop('corn')">🌽 Milho</div>
        </div>

        <div class="action-bar">
            <button class="action-btn till" id="btnTill" onclick="setMode('till')">⛏️ Arar</button>
            <button class="action-btn plant" id="btnPlant" onclick="setMode('plant')">🌱 Plantar</button>
            <button class="action-btn water" id="btnWater" onclick="setMode('water')">💦 Regar</button>
            <button class="action-btn harvest" id="btnHarvest" onclick="setMode('harvest')">🧺 Colher</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // CONFIGURAÇÕES GERAIS
        const GRID_SIZE = 7;
        const TILE_SIZE = 1.6;
        let currentMode = 'till';
        let selectedCrop = 'carrot';
        
        const state = {
            coins: 100, gems: 5, energy: 100,
            inventory: { carrot: 0, wheat: 0, tomato: 0, corn: 0 }
        };

        const CROP_DATA = {
            carrot: { name: 'Cenoura', color: 0xff7f50, growTime: 6, cost: 5, reward: 12 },
            wheat: { name: 'Trigo', color: 0xdaa520, growTime: 8, cost: 8, reward: 18 },
            tomato: { name: 'Tomate', color: 0xdc143c, growTime: 12, cost: 12, reward: 28 },
            corn: { name: 'Milho', color: 0xf2c631, growTime: 15, cost: 15, reward: 35 }
        };

        // THREE.JS SETUP
        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x76c4e5);
        scene.fog = new THREE.FogExp2(0x76c4e5, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 16, 16);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // ILUMINAÇÃO
        const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.5);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xfff0d0, 0.9);
        sun.position.set(20, 30, 15);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 80;
        sun.shadow.camera.left = -18;
        sun.shadow.camera.right = 18;
        sun.shadow.camera.top = 18;
        sun.shadow.camera.bottom = -18;
        scene.add(sun);

        // TERRENO & GRAMA
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x5ba348 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.receiveShadow = true;
        scene.add(ground);

        // GRID DE PLANTAÇÃO (ESTADOS DE TERRA)
        const tiles = [];
        const tileMaterials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x6bb854 }),
            tilled: new THREE.MeshLambertMaterial({ color: 0x6e492b }),
            watered: new THREE.MeshLambertMaterial({ color: 0x3d2716 })
        };

        const tileGeo = new THREE.BoxGeometry(TILE_SIZE - 0.1, 0.15, TILE_SIZE - 0.1);
        const offset = (GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2;

        for (let x = 0; x < GRID_SIZE; x++) {
            for (let z = 0; z < GRID_SIZE; z++) {
                const mesh = new THREE.Mesh(tileGeo, tileMaterials.grass);
                mesh.position.set(x * TILE_SIZE - offset, 0, z * TILE_SIZE - offset);
                mesh.receiveShadow = true;
                mesh.castShadow = true;
                
                mesh.userData = {
                    x, z,
                    state: 'grass', // 'grass', 'tilled', 'watered'
                    crop: null,
                    plantTime: 0,
                    watered: false,
                    mesh
                };
                scene.add(mesh);
                tiles.push(mesh);
            }
        }

        // PARTICULAS SIMPLES
        function createParticleBurst(pos, colorHex) {
            const group = new THREE.Group();
            const pGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const pMat = new THREE.MeshBasicMaterial({ color: colorHex });

            for (let i = 0; i < 8; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                p.userData.vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    Math.random() * 0.1 + 0.05,
                    (Math.random() - 0.5) * 0.1
                );
                group.add(p);
            }
            scene.add(group);

            let ticks = 0;
            const interval = setInterval(() => {
                ticks++;
                group.children.forEach(p => {
                    p.position.add(p.userData.vel);
                    p.scale.multiplyScalar(0.9);
                });
                if (ticks > 20) {
                    clearInterval(interval);
                    scene.remove(group);
                }
            }, 30);
        }

        // INTERAÇÕES & CLIQUES
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.ui-overlay')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(tiles);

            if (intersects.length > 0) {
                const tile = intersects[0].object;
                handleTileAction(tile);
            }
        });

        function handleTileAction(tile) {
            const data = tile.userData;

            if (currentMode === 'till') {
                if (data.state === 'grass') {
                    data.state = 'tilled';
                    tile.material = tileMaterials.tilled;
                    createParticleBurst(tile.position, 0x6e492b);
                    notify('Terra arada!');
                }
            } 
            else if (currentMode === 'plant') {
                if (data.state !== 'grass' && !data.crop) {
                    const info = CROP_DATA[selectedCrop];
                    if (state.coins < info.cost) {
                        notify('Moedas insuficientes!', '#e11d48');
                        return;
                    }
                    state.coins -= info.cost;
                    updateUI();

                    // Criar objeto visual do broto
                    const plantMesh = new THREE.Mesh(
                        new THREE.ConeGeometry(0.2, 0.4, 5),
                        new THREE.MeshLambertMaterial({ color: 0x4ade80 })
                    );
                    plantMesh.position.set(tile.position.x, 0.2, tile.position.z);
                    scene.add(plantMesh);

                    data.crop = { type: selectedCrop, mesh: plantMesh, progress: 0 };
                    data.plantTime = Date.now();
                    createParticleBurst(tile.position, 0x4ade80);
                    notify(`${info.name} plantada!`);
                }
            } 
            else if (currentMode === 'water') {
                if (data.state === 'tilled') {
                    data.state = 'watered';
                    tile.material = tileMaterials.watered;
                    createParticleBurst(tile.position, 0x3b82f6);
                    notify('Terra regada!');
                }
            } 
            else if (currentMode === 'harvest') {
                if (data.crop && data.crop.progress >= 1) {
                    const info = CROP_DATA[data.crop.type];
                    state.coins += info.reward;
                    updateUI();

                    scene.remove(data.crop.mesh);
                    createParticleBurst(tile.position, info.color);
                    data.crop = null;
                    data.state = 'grass';
                    tile.material = tileMaterials.grass;
                    notify(`Colheita realizada! +💰 ${info.reward}`);
                }
            }
        }

        // CONTROLES DE UI
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add('active');
            
            const cropPopup = document.getElementById('cropPopup');
            if (mode === 'plant') cropPopup.classList.add('active');
            else cropPopup.classList.remove('active');
        }

        function selectCrop(crop) {
            selectedCrop = crop;
            document.querySelectorAll('.crop-chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
        }

        function notify(text, color = '#236b35') {
            const old = document.querySelector('.notification');
            if (old) old.remove();

            const el = document.createElement('div');
            el.className = 'notification';
            el.style.background = color;
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function updateUI() {
            document.getElementById('coins').textContent = state.coins;
            document.getElementById('gems').textContent = state.gems;
            document.getElementById('energy').textContent = state.energy;
        }

        // LOOP DE ANIMAÇÃO & ATUALIZAÇÕES
        function animate() {
            requestAnimationFrame(animate);

            // Atualizar crescimento das plantas
            const now = Date.now();
            tiles.forEach(tile => {
                const data = tile.userData;
                if (data.crop && data.crop.progress < 1) {
                    const info = CROP_DATA[data.crop.type];
                    const speedMultiplier = data.state === 'watered' ? 2 : 1; // Água acelera crescimento
                    const elapsed = (now - data.plantTime) / 1000;
                    data.crop.progress = Math.min(1, (elapsed * speedMultiplier) / info.growTime);

                    // Aumenta escala com o crescimento
                    const scale = 0.3 + data.crop.progress * 0.9;
                    data.crop.mesh.scale.set(scale, scale, scale);

                    // Trocar para a cor madura ao finalizar
                    if (data.crop.progress >= 1) {
                        data.crop.mesh.material.color.setHex(info.color);
                    }
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setMode('till');
        animate();
    </script>
</body>
</html>
