<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cozy Farm 3D - Ultimate Edition</title>
    <meta name="theme-color" content="#236b35">
    <style>
        :root {
            --field-ink: #1d3322;
            --field-forest: #236b35;
            --field-leaf: #4b9b38;
            --field-paper: #f5f0d9;
            --field-paper-edge: #d6bc7f;
            --field-shadow: rgba(24,43,25,.32);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #70b8d6 0%, #a7c979 100%);
            color: var(--field-ink);
            user-select: none;
        }
        #gameCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        .ui-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
        
        .top-bar { display: flex; justify-content: center; gap: 12px; padding: 14px; pointer-events: all; }
        .resource-box {
            background: rgba(30, 48, 32, 0.92);
            border: 2px solid rgba(244, 239, 220, 0.4);
            color: #fff; padding: 8px 16px; border-radius: 14px;
            display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1rem;
            box-shadow: 0 6px 16px var(--field-shadow); backdrop-filter: blur(4px);
        }
        .resource-icon { font-size: 1.2em; }
        
        .action-bar {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; pointer-events: all; align-items: center;
            background: rgba(245, 240, 217, 0.95); border: 2px solid var(--field-paper-edge);
            padding: 10px 16px; border-radius: 22px; box-shadow: 0 10px 25px var(--field-shadow);
        }
        .action-btn {
            background: var(--field-forest); color: white; border: none;
            padding: 12px 18px; border-radius: 14px; font-size: 1rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease;
        }
        .action-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .action-btn.till { background: #8b5a2b; }
        .action-btn.plant { background: #278b43; }
        .action-btn.water { background: #2563eb; }
        .action-btn.harvest { background: #d97706; }
        .action-btn.active { outline: 3px solid #ffde59; transform: scale(1.05); }

        .crop-selector-popup {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96); border: 2px solid var(--field-paper-edge);
            padding: 12px; border-radius: 18px; display: none; gap: 10px; pointer-events: all;
            box-shadow: 0 10px 28px rgba(0,0,0,0.25);
        }
        .crop-selector-popup.active { display: flex; }
        .crop-chip {
            padding: 10px 14px; border-radius: 12px; border: 2px solid #ddd;
            background: #fffdf5; cursor: pointer; font-weight: bold; font-size: 0.9rem;
            display: flex; align-items: center; gap: 6px; transition: all 0.1s;
        }
        .crop-chip:hover { transform: translateY(-2px); }
        .crop-chip.active { border-color: var(--field-leaf); background: #eef5d8; }

        .notification {
            position: fixed; top: 75px; left: 50%; transform: translateX(-50%);
            background: var(--field-forest); color: white; padding: 10px 20px; border-radius: 12px;
            box-shadow: 0 6px 16px var(--field-shadow); font-weight: bold; font-size: 0.95rem;
            z-index: 200; animation: popup 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popup { from { transform: translate(-50%, -20px) scale(0.8); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }

        .controls-hint {
            position: fixed; top: 16px; left: 16px; background: rgba(0,0,0,0.65); color: #fff;
            padding: 12px 16px; border-radius: 12px; font-size: 0.82rem; pointer-events: none; line-height: 1.5;
            backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls-hint">
        <strong>🎮 Controles:</strong><br>
        • W / S ou Setas: Mover FRENTE / TRÁS<br>
        • A / D ou Setas: Virar ESQUERDA / DIREITA<br>
        • Clique na terra: Executar ação selecionada
    </div>

    <div class="ui-overlay">
        <div class="top-bar">
            <div class="resource-box"><span class="resource-icon">💰</span><span id="coins">100</span></div>
            <div class="resource-box"><span class="resource-icon">💎</span><span id="gems">5</span></div>
            <div class="resource-box"><span class="resource-icon">⚡</span><span id="energy">100</span></div>
        </div>

        <div class="crop-selector-popup" id="cropPopup">
            <div class="crop-chip active" onclick="selectCrop('carrot')">🥕 Cenoura (Custo: 5)</div>
            <div class="crop-chip" onclick="selectCrop('wheat')">🌾 Trigo (Custo: 8)</div>
            <div class="crop-chip" onclick="selectCrop('tomato')">🍅 Tomate (Custo: 12)</div>
            <div class="crop-chip" onclick="selectCrop('corn')">🌽 Milho (Custo: 15)</div>
        </div>

        <div class="action-bar">
            <button class="action-btn till" id="btnTill" onclick="setMode('till')">⛏️ Arar</button>
            <button class="action-btn plant" id="btnPlant" onclick="setMode('plant')">🌱 Plantar</button>
            <button class="action-btn water" id="btnWater" onclick="setMode('water')">💦 Regar</button>
            <button class="action-btn harvest" id="btnHarvest" onclick="setMode('harvest')">🧺 Colher</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const GRID_SIZE = 7;
        const TILE_SIZE = 1.6;
        let currentMode = 'till';
        let selectedCrop = 'carrot';
        
        const state = {
            coins: 100, gems: 5, energy: 100,
            inventory: { carrot: 0, wheat: 0, tomato: 0, corn: 0 }
        };

        const CROP_DATA = {
            carrot: { name: 'Cenoura', color: 0xff7f50, growTime: 5, cost: 5, reward: 12 },
            wheat: { name: 'Trigo', color: 0xdaa520, growTime: 7, cost: 8, reward: 18 },
            tomato: { name: 'Tomate', color: 0xdc143c, growTime: 10, cost: 12, reward: 28 },
            corn: { name: 'Milho', color: 0xf2c631, growTime: 12, cost: 15, reward: 35 }
        };

        // SETUP THREE.JS
        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x76c4e5);
        scene.fog = new THREE.FogExp2(0x76c4e5, 0.012);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // ILUMINAÇÃO
        const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.65);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xfff0d0, 0.9);
        sun.position.set(25, 35, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 90;
        sun.shadow.camera.left = -25;
        sun.shadow.camera.right = 25;
        sun.shadow.camera.top = 25;
        sun.shadow.camera.bottom = -25;
        scene.add(sun);

        // AMBIENTE
        const environmentGroup = new THREE.Group();
        scene.add(environmentGroup);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.MeshLambertMaterial({ color: 0x5fa846 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.receiveShadow = true;
        environmentGroup.add(ground);

        const road = new THREE.Mesh(
            new THREE.BoxGeometry(6, 0.02, 120),
            new THREE.MeshLambertMaterial({ color: 0x75441f })
        );
        road.position.set(-10, 0, 0);
        road.receiveShadow = true;
        environmentGroup.add(road);

        function createTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.3, 1.5, 8),
                new THREE.MeshLambertMaterial({ color: 0x5b3c27 })
            );
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            tree.add(trunk);

            const foliage = new THREE.Mesh(
                new THREE.DodecahedronGeometry(1.2, 1),
                new THREE.MeshLambertMaterial({ color: 0x2e8b57 })
            );
            foliage.position.y = 2.2;
            foliage.castShadow = true;
            tree.add(foliage);

            tree.position.set(x, 0, z);
            environmentGroup.add(tree);
        }

        for (let i = -50; i <= 50; i += 12) {
            createTree(i, -18);
            createTree(-22, i);
        }

        // CELEIRO
        const barn = new THREE.Group();
        const barnBase = new THREE.Mesh(
            new THREE.BoxGeometry(5, 3, 4),
            new THREE.MeshLambertMaterial({ color: 0xc6382e })
        );
        barnBase.position.y = 1.5;
        barnBase.castShadow = true;
        barn.add(barnBase);

        const barnRoof = new THREE.Mesh(
            new THREE.ConeGeometry(4, 2.2, 4),
            new THREE.MeshLambertMaterial({ color: 0x2a9b83 })
        );
        barnRoof.position.y = 4.1;
        barnRoof.rotation.y = Math.PI / 4;
        barnRoof.castShadow = true;
        barn.add(barnRoof);
        barn.position.set(-8, 0, -8);
        environmentGroup.add(barn);

        // FEIRA
        const stall = new THREE.Group();
        const counter = new THREE.Mesh(
            new THREE.BoxGeometry(2.5, 1, 1),
            new THREE.MeshLambertMaterial({ color: 0x8b5e3c })
        );
        counter.position.y = 0.5;
        counter.castShadow = true;
        stall.add(counter);
        stall.position.set(-6, 0, 4);
        environmentGroup.add(stall);

        // JOGADOR
        const player = new THREE.Group();
        const playerBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.35, 0.4, 1.1, 12),
            new THREE.MeshLambertMaterial({ color: 0x138bd1 })
        );
        playerBody.position.y = 0.55;
        playerBody.castShadow = true;
        player.add(playerBody);

        const playerHead = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 12, 12),
            new THREE.MeshLambertMaterial({ color: 0xf2c596 })
        );
        playerHead.position.y = 1.3;
        playerHead.castShadow = true;
        player.add(playerHead);

        player.position.set(2, 0, 2);
        scene.add(player);

        let playerHeading = 0;
        const keysPressed = {};
        window.addEventListener('keydown', (e) => { keysPressed[e.code] = true; });
        window.addEventListener('keyup', (e) => { keysPressed[e.code] = false; });

        function updatePlayerMovement() {
            let moveSpeed = 0.08;
            let rotSpeed = 0.04;
            let moving = false;

            if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) { playerHeading += rotSpeed; }
            if (keysPressed['KeyD'] || keysPressed['ArrowRight']) { playerHeading -= rotSpeed; }

            let currentDir = 0;
            if (keysPressed['KeyW'] || keysPressed['ArrowUp']) { currentDir = 1; moving = true; }
            if (keysPressed['KeyS'] || keysPressed['ArrowDown']) { currentDir = -1; moving = true; }

            if (moving) {
                player.position.x += Math.sin(playerHeading) * moveSpeed * currentDir;
                player.position.z += Math.cos(playerHeading) * moveSpeed * currentDir;
            }
            player.rotation.y = playerHeading;

            const targetCamX = player.position.x + Math.sin(playerHeading) * -6;
            const targetCamZ = player.position.z + Math.cos(playerHeading) * -6;
            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.y += (10 - camera.position.y) * 0.1;
            camera.position.z += (targetCamZ - camera.position.z) * 0.1;
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
        }

        // GRID DE PLANTAÇÃO
        const tiles = [];
        const tileMaterials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x6bb854 }),
            tilled: new THREE.MeshLambertMaterial({ color: 0x6e492b }),
            watered: new THREE.MeshLambertMaterial({ color: 0x3d2716 })
        };

        const tileGeo = new THREE.BoxGeometry(TILE_SIZE - 0.1, 0.15, TILE_SIZE - 0.1);
        const gridOffset = (GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2;

        for (let x = 0; x < GRID_SIZE; x++) {
            for (let z = 0; z < GRID_SIZE; z++) {
                const mesh = new THREE.Mesh(tileGeo, tileMaterials.grass);
                mesh.position.set(x * TILE_SIZE - gridOffset, 0, z * TILE_SIZE - gridOffset + 2);
                mesh.receiveShadow = true;
                mesh.castShadow = true;
                
                mesh.userData = {
                    x, z,
                    state: 'grass',
                    crop: null,
                    plantTime: 0,
                    mesh
                };
                scene.add(mesh);
                tiles.push(mesh);
            }
        }

        // EFEITOS
        function createParticleBurst(pos, colorHex) {
            const group = new THREE.Group();
            const pGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const pMat = new THREE.MeshBasicMaterial({ color: colorHex });

            for (let i = 0; i < 8; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                p.userData.vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.12,
                    Math.random() * 0.12 + 0.04,
                    (Math.random() - 0.5) * 0.12
                );
                group.add(p);
            }
            scene.add(group);

            let ticks = 0;
            const interval = setInterval(() => {
                ticks++;
                group.children.forEach(p => {
                    p.position.add(p.userData.vel);
                    p.scale.multiplyScalar(0.9);
                });
                if (ticks > 25) {
                    clearInterval(interval);
                    scene.remove(group);
                }
            }, 30);
        }

        // INTERAÇÃO
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.ui-overlay') || e.target.closest('.controls-hint')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(tiles);

            if (intersects.length > 0) {
                const tile = intersects[0].object;
                handleTileAction(tile);
            }
        });

        function handleTileAction(tile) {
            const data = tile.userData;

            if (currentMode === 'till') {
                if (data.state === 'grass') {
                    data.state = 'tilled';
                    tile.material = tileMaterials.tilled;
                    createParticleBurst(tile.position, 0x6e492b);
                    notify('Terra arada com sucesso!');
                }
            } 
            else if (currentMode === 'plant') {
                if (data.state !== 'grass' && !data.crop) {
                    const info = CROP_DATA[selectedCrop];
                    if (state.coins < info.cost) {
                        notify('Moedas insuficientes!', '#e11d48');
                        return;
                    }
                    state.coins -= info.cost;
                    updateUI();

                    const plantMesh = new THREE.Mesh(
                        new THREE.ConeGeometry(0.25, 0.45, 6),
                        new THREE.MeshLambertMaterial({ color: 0x4ade80 })
                    );
                    plantMesh.position.set(tile.position.x, 0.2, tile.position.z);
                    scene.add(plantMesh);

                    data.crop = { type: selectedCrop, mesh: plantMesh, progress: 0 };
                    data.plantTime = Date.now();
                    createParticleBurst(tile.position, 0x4ade80);
                    notify(`${info.name} plantada!`);
                }
            } 
            else if (currentMode === 'water') {
                if (data.state === 'tilled') {
                    data.state = 'watered';
                    tile.material = tileMaterials.watered;
                    createParticleBurst(tile.position, 0x3b82f6);
                    notify('Terra regada! Crescimento acelerado.');
                }
            } 
            else if (currentMode === 'harvest') {
                if (data.crop && data.crop.progress >= 1) {
                    const info = CROP_DATA[data.crop.type];
                    state.coins += info.reward;
                    updateUI();

                    scene.remove(data.crop.mesh);
                    createParticleBurst(tile.position, info.color);
                    data.crop = null;
                    data.state = 'grass';
                    tile.material = tileMaterials.grass;
                    notify(`Colheita realizada! +💰 ${info.reward}`);
                }
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add('active');
            
            const cropPopup = document.getElementById('cropPopup');
            if (mode === 'plant') cropPopup.classList.add('active');
            else cropPopup.classList.remove('active');
        }

        function selectCrop(crop) {
            selectedCrop = crop;
            document.querySelectorAll('.crop-chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
        }

        function notify(text, color = '#236b35') {
            const old = document.querySelector('.notification');
            if (old) old.remove();

            const el = document.createElement('div');
            el.className = 'notification';
            el.style.background = color;
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2200);
        }

        function updateUI() {
            document.getElementById('coins').textContent = state.coins;
            document.getElementById('gems').textContent = state.gems;
            document.getElementById('energy').textContent = state.energy;
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePlayerMovement();

            const now = Date.now();
            tiles.forEach(tile => {
                const data = tile.userData;
                if (data.crop && data.crop.progress < 1) {
                    const info = CROP_DATA[data.crop.type];
                    const speedMultiplier = data.state === 'watered' ? 2 : 1;
                    const elapsed = (now - data.plantTime) / 1000;
                    data.crop.progress = Math.min(1, (elapsed * speedMultiplier) / info.growTime);

                    const scale = 0.3 + data.crop.progress * 0.9;
                    data.crop.mesh.scale.set(scale, scale, scale);

                    if (data.crop.progress >= 1) {
                        data.crop.mesh.material.color.setHex(info.color);
                    }
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setMode('till');
        updateUI();
        animate();
    </script>
</body>
</html>
